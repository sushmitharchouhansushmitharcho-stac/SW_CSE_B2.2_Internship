<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS modification via JS</title>
</head>
<body> 
    <!--  TC = Text color -->
    <p id="txt">Hello Namaste</p>
    <button id="changeTCBtn">Change Text Color</button>  
    <button id="changeBgBtn">Change Bg color</button>

    <script>
        const txt = document.getElementById("txt");
        const changeTCBn = document.getElementById("changeTCBtn");
        const changeBgBtn = document.getElementById("changeBgBtn");

        changeTCBn.addEventListener("click",function(){
            txt.style.color= "blue";
        })

        changeBgBtn.addEventListener("click",function(){
          document.body.style.backgroundColor= "lightblue";
        })
    </Script>
    </script>
</body>
</html>

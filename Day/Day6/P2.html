    <title>Box Model</title>
    <style>
        .box{
            width: 200px;
            height: 100px;
            background-color: cadetblue;
            /* top(1) - right(2) - bottom(1) - left(2) */
            padding:30px  20px;

            /* Border */
            /* shorthand representation */
            /* border: 2px solid blue; */
            /* Line display style: solid | dashed | dotted  */

            /* Margin */
            /* Shortand */

            margin-top: 20px;
            margin-right: 10px;
            margin-bottom: 15px;
            margin-left: 50px;

        }
    </style>

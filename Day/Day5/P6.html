<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flexbox</title>
    <style>
        .container{
             display: flex;
             border: 2px solid blue;
             gap: 10px;
             padding: 10px;

        }
        .item{
            background-color: burlywood;
            color: darkred;
            padding: 15px;
            
        }
        
    </style>
</head>
<body>
    <p>CSS Flexbox: is a one-dimensional layout system designed to arrange and align itsems
        in a container(a tag holds a tag in it), either in a row or column. (usage)It make much easier to creaat responsive, flexible layouts without complex positioning or floats.
    </p>
    <div class="container">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>

    </div>
</body>
</html>

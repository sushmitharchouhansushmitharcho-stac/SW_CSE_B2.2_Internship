<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors |class selector</title>
    <style>
        .style1{
            font-size: 18px;
            background-color: rgb(208, 208, 35);
            color:aqua;
        }
        .style2{
            color:blueviolet;
            
        }
        .style3{
            font-family:'Courier New', Courier, monospace;
            font-weight: bold; 
        }
    </style>
</head>
<body>
    <h1 class="style1">class selector</h1>
    <h1 class="style2"> Heading tag itself; but a different style</h1>
    <p class="style3">This is a new paragraph that I've created.</p>
    <p class="style2">This is the second paragraph</p>
</body>
</html>

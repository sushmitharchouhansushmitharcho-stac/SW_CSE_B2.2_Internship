<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tranform: translatr | rotate</title>
    <style>
        .box{
            transform:translateX(50px);
            background-color: burlywood;
            border: 2px solid black;
        }
         .box1{
            transform:translatey(20px);
            background-color: rgb(213, 82, 42);
            border: 2px solid black;
        }
         .box2{
            transform:translate(20px,30px);
            background-color: rgb(101, 225, 107);
            border: 2px solid black;
        }
          .box3{
            transform:rotateZ(180deg);
            background-color: rgb(29, 132, 152);
            border: 2px solid black;
          }
    </style>
</head>
<body>
    <p>CSS Transform: property visually moves, rotate, 
        enlarge, shrink. It 2d or 3d</p>
        <!-- Synthax -->
         tranform: transform-function(value)

         <div class="box">
            box
         </div>

          <div class="box1">
            box1
         </div>

          <div class="box2">
            box2
         </div>

         <div class="box3">
            box3
         </div>

          <div class="box4">
            box4
         </div>

         <!-- translateX, translateY, translate | rotate(+/-) rotateX -->
</body>
</html>

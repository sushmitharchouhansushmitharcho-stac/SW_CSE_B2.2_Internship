<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tranform: translatr | rotate | sclae | skew</title>
    <style>
        .box{
            transform:translateX(50px);
            background-color: burlywood;
            border: 2px solid black;
            border-radius: 10px;
        }
        .box1{
            transform:translatey(20px);
            background-color: rgb(213, 82, 42);
            border: 2px solid black;
        }
        .box2{
            transform:translate(20px,30px);
            background-color: rgb(101, 225, 107);
            border: 2px solid black;
        }
        .box3{
            transform:rotateX(180deg);
            background-color: rgb(29, 132, 152);
            border: 2px solid black;
        }
        .box4{
            margin-left: 40px;
            /* scale, scaleX, scaleY, scale3d */
            transform: scale3d(1.2 , 1.6 , 1);
            width: 100px;
            height: 100pz;
            background-color: rgb(188, 230, 62);
            border: 2px solid black;
            margin-top: 20px;
        }
        .box5{
            width: 100px;
            height: 100px;
            background-color: rgb(244, 226, 89);
            /* skew: slant an element along one or both axes
            skew(x,y) | skewX() | skewY()
             */
            transform: skew(5deg, 10deg);
        }
    </style>
</head>
<body>
    <p>CSS Transform: property visually moves, rotate, 
        enlarge, shrink. It 2d or 3d</p>
        <!-- Synthax -->
         tranform: transform-function(value)

        <div class="box">
            box
        </div>

        <div class="box1">
            box1
        </div>
    <br>

        <div class="box2">
            box2
        </div>

        <div class="box3">
            box3
        </div>

        <!-- translateX, translateY, translate | rotate(+/-) rotateX -->
        <div class="box4">
            box4
        </div>
        
    </br>

        <div class="box5">
            box5
        </div>
</body>
</html>

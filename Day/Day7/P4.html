<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Variables</title>
    <style>
        :root{
            --primary-color: red;
            --secondary-color:#d68034;
            --spacing: 16px;
            --border-radius: 6px;
        }
        button{
            background-color: var(--primary-color);
            padding: var(--spacing);
            border-radius: var(--border-radius);
        }
        a{
            color: var(--secondary-color);
        }
    </style>
</head>
<body>
    <p>CSS Variables: custom properties, lets us store reusable CSS: colors, spacing, font sizes
        shadows, animatio settings.
        <!-- Basic syntax:
        :root{
            --primary-color: red;
            --spacing: 16px;
            --borber-radius: 6px;
        }
        button{
            background-color: var(--primary-color);
            padding: var(--spacing);
            border-radius: var(--border-radius);
        } -->
        <button>Click me</button>
        <a href="">Explore more</a>
    </p>
</body>
</html>

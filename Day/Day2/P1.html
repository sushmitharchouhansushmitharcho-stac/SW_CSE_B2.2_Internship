<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image tag</title>
</head>
<body>
    <!-- Image tag: -->
     <img src="dog_image.jpg" alt="the image of the dog">
     <!-- src: source | alt: alternative -->
      <!-- Image tag: jpg/jpeg | png | webp | gif -->
     <img src="dog_image.jpg" alt="the image of the dog" width="400px" height="250px">
     <!-- Title - tooltip text -->
      <!-- Releative image src -->
     <img src="/SW_CSE_B2.2_Internship/Day/Images/dog.jpg" alt="the image of the dog" title="My name is Tommy.">
     <!-- Responsive images: CSS -->
     <!-- CDN: Content Delivery Network / remote server -->
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQpfeiclknAq9FEwcLYkHn3noEf1n45R3M9IJaXoMR5sA&s=10" alt="Remote image not existing">
</body>
</html>
